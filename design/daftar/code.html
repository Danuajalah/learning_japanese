<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Komorebi Learning - Daftar</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Montserrat:wght@700&amp;family=Noto+Sans+JP:wght@500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed-variant": "#920021",
                        "on-secondary": "#ffffff",
                        "primary": "#864e5a",
                        "surface-dim": "#c9dcf3",
                        "on-tertiary-fixed-variant": "#3a4a49",
                        "tertiary-container": "#bccecd",
                        "on-primary-fixed-variant": "#6b3743",
                        "inverse-primary": "#fbb3c1",
                        "secondary-fixed": "#ffdad9",
                        "surface-container-highest": "#d1e4fb",
                        "secondary": "#ba002c",
                        "primary-container": "#ffb7c5",
                        "primary-fixed-dim": "#fbb3c1",
                        "primary-fixed": "#ffd9df",
                        "inverse-surface": "#203243",
                        "surface-container-lowest": "#ffffff",
                        "background": "#f7f9ff",
                        "surface-container-low": "#edf4ff",
                        "outline": "#837375",
                        "tertiary-fixed": "#d4e6e5",
                        "inverse-on-surface": "#e8f2ff",
                        "surface-container": "#e3efff",
                        "error-container": "#ffdad6",
                        "on-error": "#ffffff",
                        "surface-container-high": "#d9eaff",
                        "surface": "#f7f9ff",
                        "on-secondary-fixed": "#400009",
                        "on-primary-fixed": "#360c19",
                        "surface-bright": "#f7f9ff",
                        "surface-tint": "#864e5a",
                        "on-secondary-container": "#fffbff",
                        "on-surface-variant": "#514345",
                        "tertiary": "#516161",
                        "on-error-container": "#93000a",
                        "on-background": "#091d2e",
                        "outline-variant": "#d6c2c4",
                        "tertiary-fixed-dim": "#b8cac9",
                        "surface-variant": "#d1e4fb",
                        "on-surface": "#091d2e",
                        "on-tertiary-fixed": "#0e1e1e",
                        "on-primary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "on-primary-container": "#7b4551",
                        "error": "#ba1a1a",
                        "secondary-fixed-dim": "#ffb3b3",
                        "on-tertiary-container": "#485858",
                        "secondary-container": "#df2842"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "unit": "8px",
                        "card-gap": "12px",
                        "container-margin": "20px"
                    },
                    "fontFamily": {
                        "kanji-card": ["Noto Sans JP"],
                        "headline-lg": ["Montserrat"],
                        "display-jp": ["Noto Sans JP"],
                        "headline-lg-mobile": ["Montserrat"],
                        "body-md": ["Inter"],
                        "label-caps": ["Inter"]
                    },
                    "fontSize": {
                        "kanji-card": ["64px", { "lineHeight": "1.1", "fontWeight": "500" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "display-jp": ["48px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .squish-click { transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1); }
        .squish-click:active { transform: scale(0.97) translateY(2px); box-shadow: none !important; }
        .soft-sunk-input {
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            transition: all 0.2s ease;
        }
        .soft-sunk-input:focus {
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02), 0 0 0 2px var(--tw-ring-color);
        }
    </style>
</head>
<body class="bg-background min-h-screen flex items-center justify-center p-container-margin md:p-8 overflow-x-hidden antialiased text-on-surface">
<!-- Decorative Background Blob -->
<div class="fixed top-[-10%] right-[-10%] w-96 h-96 bg-primary-container/30 rounded-full blur-3xl -z-10 pointer-events-none"></div>
<div class="fixed bottom-[-10%] left-[-10%] w-80 h-80 bg-surface-variant/40 rounded-full blur-3xl -z-10 pointer-events-none"></div>
<!-- Main Registration Card Container -->
<main class="w-full max-w-[440px] bg-surface-container-lowest rounded-[24px] shadow-[0_12px_32px_rgba(255,183,197,0.15)] border border-outline-variant/20 p-8 md:p-10 flex flex-col gap-8 relative z-10">
<!-- Header Section -->
<header class="flex flex-col items-center text-center gap-3">
<div class="flex items-center justify-center w-14 h-14 bg-primary-container/20 rounded-2xl mb-2">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">local_florist</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary tracking-tight">Daftar Akun Baru</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Mulai perjalanan belajar bahasa Jepang yang menyenangkan hari ini.</p>
</header>
<!-- Registration Form -->
<form class="flex flex-col gap-5">
<!-- Full Name Input -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface ml-1" for="fullname">Nama Lengkap</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">person</span>
<input class="w-full h-12 bg-surface-container-lowest border border-outline-variant/60 rounded-xl pl-12 pr-4 font-body-md text-body-md text-on-surface placeholder:text-outline-variant soft-sunk-input focus:outline-none focus:border-primary focus:ring-primary/20" id="fullname" placeholder="Komorebi Student" type="text"/>
</div>
</div>
<!-- Email Input -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface ml-1" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full h-12 bg-surface-container-lowest border border-outline-variant/60 rounded-xl pl-12 pr-4 font-body-md text-body-md text-on-surface placeholder:text-outline-variant soft-sunk-input focus:outline-none focus:border-primary focus:ring-primary/20" id="email" placeholder="nama@email.com" type="email"/>
</div>
</div>
<!-- Username Input -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface ml-1" for="username">Username</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">alternate_email</span>
<input class="w-full h-12 bg-surface-container-lowest border border-outline-variant/60 rounded-xl pl-12 pr-4 font-body-md text-body-md text-on-surface placeholder:text-outline-variant soft-sunk-input focus:outline-none focus:border-primary focus:ring-primary/20" id="username" placeholder="komorebi_learner" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface ml-1" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full h-12 bg-surface-container-lowest border border-outline-variant/60 rounded-xl pl-12 pr-4 font-body-md text-body-md text-on-surface placeholder:text-outline-variant soft-sunk-input focus:outline-none focus:border-primary focus:ring-primary/20" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Submit Button (Primary) -->
<button class="w-full h-14 mt-4 bg-primary text-on-primary rounded-xl font-label-caps text-label-caps shadow-[0_8px_20px_rgba(134,78,90,0.25)] hover:bg-on-primary-fixed-variant squish-click flex items-center justify-center gap-2 transition-colors" type="button">
<span>Daftar</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center gap-4 w-full">
<div class="h-px bg-outline-variant/40 flex-1"></div>
<span class="font-label-caps text-label-caps text-outline">ATAU</span>
<div class="h-px bg-outline-variant/40 flex-1"></div>
</div>
<!-- Social Login (Secondary) -->
<button class="w-full h-14 border-2 border-primary-container text-primary bg-transparent rounded-xl font-label-caps text-label-caps hover:bg-primary-container/10 squish-click flex items-center justify-center gap-3 transition-colors" type="button">
<!-- Inline SVG for Google Logo to avoid external requests for simple icons when possible, but using standard pattern here for simplicity if preferred. Using generic icon for structural demo as requested to not alter images unnecessarily -->
<svg class="w-5 h-5" fill="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path></svg>
            Daftar dengan Google
        </button>
<!-- Footer Link -->
<div class="text-center mt-2">
<p class="font-body-md text-body-md text-on-surface-variant">
                Sudah punya akun? 
                <a class="text-primary font-semibold hover:underline decoration-2 underline-offset-4" href="#">Masuk</a>
</p>
</div>
</main>
</body></html>
