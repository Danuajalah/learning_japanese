<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        
        /* Genkouyoushi Grid Pattern */
        .genkouyoushi-grid {
            background-image: 
                linear-gradient(to right, #d6c2c4 1px, transparent 1px),
                linear-gradient(to bottom, #d6c2c4 1px, transparent 1px),
                linear-gradient(to right, rgba(214, 194, 196, 0.3) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(214, 194, 196, 0.3) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 50% 50%, 50% 50%;
            background-position: center;
        }

        /* Tactile Button Press */
        .btn-tactile {
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(134, 78, 90, 0.15); /* Primary color shadow */
        }
        .btn-tactile:active {
            transform: translateY(2px);
            box-shadow: 0 0 0 rgba(134, 78, 90, 0);
        }
        
        .btn-secondary-tactile {
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(131, 115, 117, 0.1);
        }
        .btn-secondary-tactile:active {
            transform: translateY(2px);
            box-shadow: 0 0 0 rgba(131, 115, 117, 0);
        }

        /* Drawing Canvas Styles */
        #drawingCanvas {
            touch-action: none; /* Prevent scrolling while drawing */
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md text-body-md h-screen flex flex-col overflow-hidden">
<!-- TopAppBar -->
<header class="bg-surface docked full-width top-0 flex justify-between items-center w-full px-container-margin py-unit max-w-7xl mx-auto z-50">
<div class="flex items-center gap-4">
<button class="text-on-surface-variant hover:scale-105 active:scale-95 transition-all duration-200 p-2 rounded-full hover:bg-surface-container">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">Papan Tulis Kanji</h1>
</div>
<div class="flex items-center">
<!-- Trailing action (Info) -->
<button class="text-on-surface-variant hover:scale-105 active:scale-95 transition-all duration-200 p-2 rounded-full hover:bg-surface-container">
<span class="material-symbols-outlined" data-icon="info">info</span>
</button>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col items-center justify-center p-container-margin relative w-full max-w-lg mx-auto">
<!-- Target Character Info -->
<div class="mb-6 text-center">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface font-bold">学</h2>
<p class="text-on-surface-variant font-label-caps text-label-caps mt-1">GAKU, mana - Learn, Study</p>
</div>
<!-- Canvas Container -->
<div class="relative w-full aspect-square max-w-[320px] bg-surface-container-lowest border border-outline-variant rounded-xl shadow-[0_8px_16px_rgba(134,78,90,0.05)] overflow-hidden">
<!-- Genkouyoushi Background Grid -->
<div class="absolute inset-0 genkouyoushi-grid pointer-events-none opacity-50"></div>
<!-- Faint Outline of the Kanji -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none select-none">
<span class="font-display-jp text-[200px] text-surface-container-high leading-none font-bold opacity-30">学</span>
</div>
<!-- Stroke Indicator (Step-by-step) -->
<div class="absolute top-4 left-4 bg-surface-container-lowest/80 backdrop-blur-sm px-3 py-1 rounded-full border border-outline-variant flex items-center gap-2">
<span class="font-label-caps text-label-caps text-on-surface-variant">Stroke</span>
<span class="font-body-md text-body-md font-bold text-primary" id="strokeCounter">1/8</span>
</div>
<!-- The actual drawing canvas -->
<canvas class="absolute inset-0 w-full h-full cursor-crosshair" id="drawingCanvas"></canvas>
</div>
<!-- Feedback Toast (Hidden by default, shown via JS) -->
<div class="absolute top-1/4 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-surface-container-high text-on-surface px-6 py-3 rounded-full shadow-lg opacity-0 transition-opacity duration-300 pointer-events-none flex items-center gap-2" id="feedbackToast">
<span class="material-symbols-outlined text-primary" data-icon="check_circle">check_circle</span>
<span class="font-body-md text-body-md font-semibold" id="feedbackText">Bagus! Urutan benar.</span>
</div>
</main>
<!-- Bottom Action Bar -->
<div class="w-full px-container-margin pb-safe pt-4 bg-surface/80 backdrop-blur-md border-t border-outline-variant/20 flex justify-center gap-4 max-w-lg mx-auto mb-8">
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-secondary p-3 rounded-xl hover:bg-surface-container active:scale-95 transition-all w-24" id="btnClear">
<span class="material-symbols-outlined mb-1" data-icon="ink_eraser">ink_eraser</span>
<span class="font-label-caps text-label-caps">Hapus</span>
</button>
<button class="flex-1 btn-tactile bg-primary-container text-on-primary-container rounded-xl py-3 px-6 flex items-center justify-center gap-2 font-bold font-body-md" id="btnCheck">
<span class="material-symbols-outlined" data-icon="done_all">done_all</span>
<span>Cek</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary p-3 rounded-xl hover:bg-surface-container active:scale-95 transition-all w-24" id="btnExample">
<span class="material-symbols-outlined mb-1" data-icon="play_circle">play_circle</span>
<span class="font-label-caps text-label-caps">Contoh</span>
</button>
</div>
<script>
        // Simple Canvas Drawing Logic
        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let currentStroke = 0;
        const totalStrokes = 8;
        const strokeCounter = document.getElementById('strokeCounter');

        // Resize canvas to match its CSS display size
        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            // Setup context defaults after resize
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = 12;
            ctx.strokeStyle = '#091d2e'; // on-background
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function startDrawing(e) {
            isDrawing = true;
            draw(e);
        }

        function stopDrawing() {
            if (isDrawing) {
                isDrawing = false;
                ctx.beginPath();
                // Simple logic to increment stroke for demo purposes
                if(currentStroke < totalStrokes) {
                    currentStroke++;
                    strokeCounter.textContent = `${currentStroke}/${totalStrokes}`;
                }
            }
        }

        function draw(e) {
            if (!isDrawing) return;
            
            e.preventDefault(); // Prevent scrolling on touch

            const rect = canvas.getBoundingClientRect();
            let clientX, clientY;

            if (e.type.includes('touch')) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            const x = clientX - rect.left;
            const y = clientY - rect.top;

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        // Mouse Events
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);

        // Touch Events
        canvas.addEventListener('touchstart', startDrawing, {passive: false});
        canvas.addEventListener('touchmove', draw, {passive: false});
        canvas.addEventListener('touchend', stopDrawing);

        // Button Actions
        document.getElementById('btnClear').addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            currentStroke = 0;
            strokeCounter.textContent = `1/${totalStrokes}`;
        });

        // Feedback Toast Logic
        function showFeedback(success) {
            const toast = document.getElementById('feedbackToast');
            const toastText = document.getElementById('feedbackText');
            const icon = toast.querySelector('.material-symbols-outlined');
            
            if(success) {
                toastText.textContent = "Bagus! Urutan benar.";
                icon.textContent = "check_circle";
                icon.className = "material-symbols-outlined text-primary";
            } else {
                toastText.textContent = "Coba lagi, urutan 3 salah.";
                icon.textContent = "error";
                icon.className = "material-symbols-outlined text-error";
            }

            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');

            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 2500);
        }

        document.getElementById('btnCheck').addEventListener('click', () => {
            // Mock check logic: if they drew something, pretend it's correct for demo, else error
            if(currentStroke > 0) {
                 showFeedback(true);
            } else {
                 showFeedback(false);
            }
        });

        document.getElementById('btnExample').addEventListener('click', () => {
             // In a real app, this would trigger an animation of the strokes
             ctx.clearRect(0, 0, canvas.width, canvas.height);
             ctx.font = "bold 200px 'Noto Sans JP'";
             ctx.fillStyle = "rgba(134, 78, 90, 0.2)"; // Primary color faded
             ctx.textAlign = "center";
             ctx.textBaseline = "middle";
             ctx.fillText("学", canvas.width/2, canvas.height/2);
             
             setTimeout(() => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                currentStroke = 0;
                strokeCounter.textContent = `1/${totalStrokes}`;
             }, 1000);
        });

    </script>
</body></html>
