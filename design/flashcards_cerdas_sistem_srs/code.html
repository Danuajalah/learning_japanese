<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Smart Flashcards - Komorebi Learning</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Montserrat:wght@700&amp;family=Noto+Sans+JP:wght@500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-error-container": "#93000a",
                    "on-tertiary-fixed-variant": "#3a4a49",
                    "on-secondary-fixed": "#400009",
                    "on-surface-variant": "#514345",
                    "primary-fixed-dim": "#fbb3c1",
                    "surface-dim": "#c9dcf3",
                    "surface-container-lowest": "#ffffff",
                    "on-primary-fixed-variant": "#6b3743",
                    "on-primary-container": "#7b4551",
                    "background": "#f7f9ff",
                    "inverse-on-surface": "#e8f2ff",
                    "secondary": "#ba002c",
                    "primary-container": "#ffb7c5",
                    "on-tertiary-container": "#485858",
                    "primary-fixed": "#ffd9df",
                    "surface": "#f7f9ff",
                    "secondary-fixed": "#ffdad9",
                    "surface-container": "#e3efff",
                    "outline": "#837375",
                    "tertiary-fixed-dim": "#b8cac9",
                    "surface-container-low": "#edf4ff",
                    "surface-variant": "#d1e4fb",
                    "on-error": "#ffffff",
                    "on-tertiary": "#ffffff",
                    "tertiary-container": "#bccecd",
                    "on-secondary": "#ffffff",
                    "error-container": "#ffdad6",
                    "inverse-surface": "#203243",
                    "on-primary": "#ffffff",
                    "on-surface": "#091d2e",
                    "on-secondary-fixed-variant": "#920021",
                    "surface-bright": "#f7f9ff",
                    "tertiary": "#516161",
                    "tertiary-fixed": "#d4e6e5",
                    "on-primary-fixed": "#360c19",
                    "on-secondary-container": "#fffbff",
                    "inverse-primary": "#fbb3c1",
                    "primary": "#864e5a",
                    "secondary-container": "#df2842",
                    "secondary-fixed-dim": "#ffb3b3",
                    "surface-container-highest": "#d1e4fb",
                    "surface-container-high": "#d9eaff",
                    "on-tertiary-fixed": "#0e1e1e",
                    "error": "#ba1a1a",
                    "surface-tint": "#864e5a",
                    "outline-variant": "#d6c2c4",
                    "on-background": "#091d2e"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "gutter": "16px",
                    "container-margin": "20px",
                    "card-gap": "12px",
                    "unit": "8px"
            },
            "fontFamily": {
                    "body-md": [
                            "Inter"
                    ],
                    "display-jp": [
                            "Noto Sans JP"
                    ],
                    "headline-lg": [
                            "Montserrat"
                    ],
                    "kanji-card": [
                            "Noto Sans JP"
                    ],
                    "label-caps": [
                            "Inter"
                    ],
                    "headline-lg-mobile": [
                            "Montserrat"
                    ]
            },
            "fontSize": {
                    "body-md": [
                            "16px",
                            {
                                    "lineHeight": "24px",
                                    "fontWeight": "400"
                            }
                    ],
                    "display-jp": [
                            "48px",
                            {
                                    "lineHeight": "1.2",
                                    "fontWeight": "700"
                            }
                    ],
                    "headline-lg": [
                            "32px",
                            {
                                    "lineHeight": "40px",
                                    "fontWeight": "700"
                            }
                    ],
                    "kanji-card": [
                            "64px",
                            {
                                    "lineHeight": "1.1",
                                    "fontWeight": "500"
                            }
                    ],
                    "label-caps": [
                            "12px",
                            {
                                    "lineHeight": "16px",
                                    "letterSpacing": "0.05em",
                                    "fontWeight": "600"
                            }
                    ],
                    "headline-lg-mobile": [
                            "24px",
                            {
                                    "lineHeight": "32px",
                                    "fontWeight": "700"
                            }
                    ]
            }
          },
        },
      }
    </script>
<style>
        .flip-card-inner {
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }
        .flip-card-front, .flip-card-back {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .flip-card-back {
            transform: rotateY(180deg);
        }
        
        .button-squish:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-hidden">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface-container docked full-width top-0 z-10">
<div class="flex justify-between items-center w-full px-container-margin py-unit max-w-7xl mx-auto">
<div class="flex items-center gap-3">
<!-- Back Button for focus mode -->
<button class="p-2 rounded-full hover:bg-surface-container-low transition-colors text-on-surface-variant dark:text-outline-variant">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary dark:text-primary-fixed-dim">Flashcards Cerdas</h1>
</div>
<!-- Progress Bar -->
<div class="flex items-center gap-4">
<div class="text-sm font-label-caps text-label-caps text-on-surface-variant text-right hidden sm:block">12 / 20 Cards</div>
<div class="w-24 sm:w-32 h-2 bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full transition-all duration-300" style="width: 60%"></div>
</div>
</div>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-1 flex flex-col items-center justify-center px-container-margin py-8 w-full max-w-md mx-auto relative">
<!-- Flashcard Area -->
<div class="w-full aspect-[3/4] sm:aspect-square relative perspective-1000 mb-8" id="flashcard-container">
<!-- Background Stack (Visual only) -->
<div class="absolute inset-0 bg-white border border-outline-variant/30 rounded-3xl shadow-sm rotate-3 scale-95 translate-y-2 z-0"></div>
<div class="absolute inset-0 bg-white border border-outline-variant/30 rounded-3xl shadow-sm -rotate-2 scale-[0.98] translate-y-1 z-0"></div>
<!-- Main Card -->
<div class="flip-card w-full h-full cursor-pointer z-10 relative" id="flashcard" onclick="this.classList.toggle('flipped')">
<div class="flip-card-inner w-full h-full relative rounded-3xl shadow-[0_8px_24px_rgba(134,78,90,0.1)] transition-transform duration-500">
<!-- Front (Kanji) -->
<div class="flip-card-front absolute inset-0 bg-surface-container-lowest border border-outline-variant/50 rounded-3xl flex flex-col items-center justify-center p-8">
<span class="font-kanji-card text-kanji-card text-on-surface mb-4">食べる</span>
<div class="absolute bottom-6 flex flex-col items-center opacity-60">
<span class="material-symbols-outlined mb-1">touch_app</span>
<span class="font-label-caps text-label-caps text-on-surface-variant">Tap to flip</span>
</div>
</div>
<!-- Back (Meaning/Reading) -->
<div class="flip-card-back absolute inset-0 bg-surface-container-lowest border border-primary-container rounded-3xl flex flex-col items-center justify-center p-8 text-center bg-gradient-to-br from-surface-container-lowest to-surface-container-low">
<div class="mb-6 w-full flex flex-col items-center">
<span class="text-sm font-label-caps text-label-caps text-primary mb-1">Hiragana</span>
<span class="font-display-jp text-display-jp text-on-surface mb-2">たべる</span>
<span class="text-lg text-on-surface-variant italic">taberu</span>
</div>
<div class="h-px w-16 bg-outline-variant/50 mb-6"></div>
<div class="w-full flex flex-col items-center">
<span class="text-sm font-label-caps text-label-caps text-primary mb-2">Meaning</span>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">To eat</h2>
</div>
<!-- SRS Info -->
<div class="absolute top-6 right-6 bg-surface-container px-3 py-1 rounded-full flex items-center gap-1 border border-outline-variant/30">
<span class="material-symbols-outlined text-sm text-primary">schedule</span>
<span class="font-label-caps text-label-caps text-xs text-on-surface-variant">Level 3</span>
</div>
</div>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="flex items-center justify-center gap-6 w-full mt-4">
<button class="button-squish flex flex-col items-center gap-2 group">
<div class="w-16 h-16 rounded-full bg-error-container text-on-error-container flex items-center justify-center shadow-[0_4px_16px_rgba(186,26,26,0.15)] transition-all hover:scale-105 group-hover:bg-error group-hover:text-on-error">
<span class="material-symbols-outlined text-3xl font-bold">close</span>
</div>
<span class="font-label-caps text-label-caps text-on-surface-variant">Belum Hafal</span>
</button>
<div class="w-px h-10 bg-outline-variant/30"></div>
<button class="button-squish flex flex-col items-center gap-2 group">
<div class="w-16 h-16 rounded-full bg-tertiary-container text-on-tertiary-container flex items-center justify-center shadow-[0_4px_16px_rgba(81,97,97,0.15)] transition-all hover:scale-105 group-hover:bg-tertiary group-hover:text-on-tertiary">
<span class="material-symbols-outlined text-3xl font-bold">check</span>
</div>
<span class="font-label-caps text-label-caps text-on-surface-variant">Sudah Hafal</span>
</button>
</div>
<div class="mt-8 text-center text-on-surface-variant text-sm font-label-caps text-label-caps flex items-center gap-2">
<span class="material-symbols-outlined text-sm">history</span>
            Next review in 4 days (SRS)
        </div>
</main>
<!-- BottomNavBar (Suppressed for focused task mode as per rules) -->
</body></html>
